<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ürünler – EforHug</title>
<link rel="stylesheet" href="/styles.css">
<script src="/cart.js" defer></script>
</head>
<body>
<div data-eh-header></div>
<main class="eh-cat">
  <h1>Ürünler</h1>
  <div class="eh-cat-bar">
    <div>Filtre: Stok durumu · Fiyat</div>
    <div>Sıralama ölçütü: Alfabetik olarak, A-Z · 2 ürün</div>
  </div>
  <div class="eh-cat-grid">
    <article class="eh-card">
      <a href="/products/powerbank">
        <div class="eh-card-img">
          <img src="/powerbank.webp" alt="EforHug Uyumlu Powerbank">
          <span class="eh-card-badge">-66% İndirim</span>
        </div>
        <div class="eh-card-meta">
          <div class="eh-card-vendor">Satıcı: MAĞAZAM</div>
          <div class="eh-card-title">EforHug Uyumlu Powerbank</div>
          <div class="eh-card-price"><strong>499.00TL</strong><s>1,499.00TL</s></div>
        </div>
      </a>
      <button type="button" class="eh-card-cta" id="add-pb">Sepete ekle</button>
    </article>
    <article class="eh-card">
      <a href="/products/cozywarm-tasinabilir-isitmali-battaniye">
        <div class="eh-card-img">
          <img src="/g1.webp" alt="EforHug™ Isıtmalı Battaniye">
          <span class="eh-card-badge">-50% İndirim</span>
        </div>
        <div class="eh-card-meta">
          <div class="eh-card-vendor">Satıcı: EFORHUG</div>
          <div class="eh-card-title">EforHug™ Isıtmalı Battaniye</div>
          <div class="eh-card-price"><strong>1,849.00TL</strong><s>3,760.00TL</s></div>
        </div>
      </a>
      <a class="eh-card-cta" href="/products/cozywarm-tasinabilir-isitmali-battaniye">Seçenekleri belirle</a>
    </article>
  </div>
</main>
<div class="eh-wave-cap" aria-hidden="true">
  <svg viewBox="0 0 1440 96" preserveAspectRatio="none">
    <path fill="#c4844a" d="M0 48C180 18 300 14 460 38C620 64 740 86 900 66C1060 44 1180 20 1300 32C1360 38 1410 50 1440 48V96H0Z"/>
    <path fill="#e2b07a" d="M0 34C160 8 280 6 420 28C580 54 700 78 860 58C1020 36 1140 10 1260 22C1340 30 1400 42 1440 38V96H0Z"/>
  </svg>
</div>
<div data-eh-footer></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('add-pb').onclick = function () {
    window.EforHugCart.addPowerbank(1)
  }
})
</script>
</body>
</html>
