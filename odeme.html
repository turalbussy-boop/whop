<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ödeme – EforHug</title>
<link rel="stylesheet" href="/styles.css?v=4">
<script src="/cart.js?v=4" defer></script>
</head>
<body class="ck-page">
<header class="ck-top">
  <a href="/"><img src="/logo.avif" alt="EforHug"></a>
</header>
<main>
  <section id="empty-state" class="ck-empty" hidden>
    <h1>Sepetin boş</h1>
    <p>Bir paket seç, burada görünsün.</p>
    <a href="/collections/all">Alışverişe Devam Et</a>
  </section>
  <section id="checkout-state" class="ck-wrap">
    <div class="ck-form">
      <p id="error-message" class="ck-error" hidden></p>
      <div id="embed-container" class="ck-embed">
        <div id="embed-placeholder" style="padding:24px;color:#8a7468">Ödeme hazırlanıyor…</div>
      </div>
    </div>
    <aside class="ck-summary">
      <h2>Sipariş özeti</h2>
      <ul id="summary-items" style="list-style:none;margin:0;padding:0"></ul>
      <div class="ck-totals">
        <div class="ck-totals-row"><span>Ara toplam</span><span id="summary-sub"></span></div>
        <div class="ck-totals-row"><span>Kargo</span><span class="free">ÜCRETSİZ</span></div>
        <div class="ck-totals-row is-total"><span>Toplam</span><span id="summary-total"></span></div>
      </div>
    </aside>
  </section>
</main>
<p class="ck-foot"><a href="/gizlilik-politikasi">Gizlilik politikası</a> · <a href="/pages/contact">İletişim</a></p>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var C = window.EforHugCart
  var items = C.getItems()
  if (items.length === 0) {
    document.getElementById('empty-state').hidden = false
    document.getElementById('checkout-state').remove()
    return
  }
  var total = C.orderTotal()
  document.getElementById('summary-sub').textContent = C.money(total)
  document.getElementById('summary-total').textContent = C.money(total)
  var list = document.getElementById('summary-items')
  var giftHost = items.findIndex(function (line) {
    return line.type !== 'powerbank'
  })
  items.forEach(function (line, index) {
    var li = document.createElement('li')
    li.className = 'ck-item'
    if (line.type === 'powerbank') {
      li.innerHTML =
        '<div class="ck-line"><img src="/powerbank.webp" alt=""><div class="ck-line-body"><p class="ck-line-title">EforHug Uyumlu Powerbank</p><p class="ck-line-subtitle">Adet ' +
        (line.qty || 1) +
        '</p></div><div class="ck-line-prices"><p class="ck-line-original">' +
        C.money(C.POWERBANK_COMPARE * (line.qty || 1)) +
        '</p><p class="ck-line-price">' +
        C.money(C.POWERBANK_PRICE * (line.qty || 1)) +
        '</p></div></div>'
    } else {
      var pack = C.PACKS[line.packQty]
      var img = C.COLOR_IMG[line.colors && line.colors[0]] || '/gri.webp'
      var nested = ''
      if (index === giftHost) {
        nested +=
          '<div class="ck-free"><img src="/powerbank.webp" alt=""><div class="ck-line-body"><p class="ck-line-title">' +
          C.POWERBANK_GIFT_TITLE +
          '</p><p class="ck-line-subtitle">' +
          C.POWERBANK_GIFT_NOTE +
          '</p></div><div class="ck-line-prices"><p class="ck-line-price">ÜCRETSİZ</p></div></div>'
      }
      if (line.includePowerbank) {
        nested +=
          '<div class="ck-free"><img src="/powerbank.webp" alt=""><div class="ck-line-body"><p class="ck-line-title">EforHug Uyumlu Powerbank</p><p class="ck-line-subtitle">ek ürün</p></div><div class="ck-line-prices"><p class="ck-line-price">' +
          C.money(C.POWERBANK_PRICE) +
          '</p></div></div>'
      }
      li.innerHTML =
        '<div class="ck-line"><img src="' +
        img +
        '" alt=""><div class="ck-line-body"><p class="ck-line-title">EforHug™ Isıtmalı Battaniye</p><p class="ck-line-subtitle">' +
        pack.label +
        ' · ' +
        (line.colors || []).join(' · ') +
        '</p></div><div class="ck-line-prices"><p class="ck-line-original">' +
        C.money(pack.compare) +
        '</p><p class="ck-line-price">' +
        C.money(pack.price) +
        '</p></div></div>' +
        nested
    }
    list.appendChild(li)
  })

  fetch('/api/checkout-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lines: items }),
  })
    .then(async function (res) {
      var contentType = res.headers.get('content-type') || ''
      if (!contentType.includes('application/json')) {
        throw new Error('Bu sayfa /api/checkout-session uç noktasına ulaşamıyor — bu dosyayı server.js ile birlikte kendi Node.js hosting\'inde çalıştırman gerekiyor (bkz. README.md).')
      }
      var json = await res.json()
      if (!res.ok) throw new Error(json.error || 'Bilinmeyen hata')
      var container = document.getElementById('embed-container')
      container.innerHTML = ''
      var embed = document.createElement('div')
      embed.id = 'whop-embedded-checkout'
      embed.setAttribute('data-whop-checkout-session', json.sessionId)
      embed.setAttribute('data-whop-checkout-theme', 'light')
      embed.setAttribute('data-whop-checkout-collect-shipping', 'true')
      embed.setAttribute('data-whop-checkout-locale', 'tr')
      embed.setAttribute('data-whop-checkout-return-url', window.location.origin + '/')
      container.appendChild(embed)
      var loader = document.createElement('script')
      loader.src = 'https://js.whop.com/static/checkout/loader.js'
      loader.async = true
      document.body.appendChild(loader)
    })
    .catch(function (err) {
      var errEl = document.getElementById('error-message')
      errEl.textContent = err.message
      errEl.hidden = false
    })
})
</script>
</body>
</html>
